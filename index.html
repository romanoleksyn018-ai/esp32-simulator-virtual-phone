<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESP32 Simulator + Virtual Phone</title>
<style>
:root{--bg:#0b0f1a;--pn:#161c2e;--ln:#2a3454;--fg:#e8ecf8;--ac:#3fb950;--bl:#4da3ff;--yl:#ffd83b;--rd:#ff4444;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
button,select,input{font:inherit;font-size:13px;background:var(--pn);color:var(--fg);border:1px solid var(--ln);border-radius:6px;padding:5px 9px;cursor:pointer}
#top{display:flex;gap:6px;padding:6px;align-items:center;border-bottom:1px solid var(--ln);flex-wrap:wrap}
#run{background:var(--ac);color:#fff;border:0;font-weight:bold}
#stop{background:#c0392b;color:#fff;border:0}
#st{font-size:12px;color:#9fb0d8;flex:1;min-width:100px}
#layout{flex:1;display:flex;min-height:0}
#left{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
#main{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;display:none}.pane.on{display:block}
svg{width:100%;height:100%;touch-action:none;background:#0b0f1a;display:block}
textarea{width:100%;height:100%;box-sizing:border-box;background:#05080f;color:#7fdf9f;border:0;padding:8px;font:12px/1.5 ui-monospace,monospace;resize:none;tab-size:2;outline:0}
#ser{width:100%;height:100%;overflow:auto;box-sizing:border-box;padding:8px;font:12px ui-monospace,monospace;white-space:pre-wrap;color:#9df29d;background:#05080f}
#pal{overflow-x:auto;border-top:1px solid var(--ln);padding:5px;display:flex;gap:5px}
#pal button{white-space:nowrap;font-size:12px;padding:4px 8px}
#tabs{display:flex;border-top:1px solid var(--ln)}
#tabs button{flex:1;border-radius:0;border:0;padding:8px}
#tabs .on{background:var(--bl);color:#000}

/* Right phone panel */
#right{width:320px;background:#07070d;border-left:1px solid var(--ln);display:flex;flex-direction:column;min-width:0}
#right-hdr{padding:8px 12px;font-family:'Courier New',monospace;font-size:11px;color:#9fb0d8;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center}
#phone-wrap{flex:1;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto}
.phone{
 width:260px;height:520px;background:#000;border-radius:36px;padding:12px;box-shadow:0 0 0 3px #222, 0 0 0 5px #111, 0 8px 40px rgba(0,0,0,.8);
 position:relative;flex-shrink:0
}
.phone::before{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);width:70px;height:18px;background:#000;border-radius:0 0 14px 14px;z-index:3;box-shadow:0 1px 0 #222}
.phone-screen{
 width:100%;height:100%;background:linear-gradient(180deg,#1a1f35 0%,#0a0d18 100%);
 border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column;
}
.phone-status{
 height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
 font-size:9px;color:#fff;font-family:system-ui;font-weight:500;position:relative;z-index:4
}
.phone-time{font-weight:600}
.phone-icons{display:flex;gap:4px;font-size:9px}
.notif-area{flex:1;padding:8px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.notif-area::-webkit-scrollbar{width:3px}
.notif-area::-webkit-scrollbar-thumb{background:#3a4568;border-radius:2px}
.notif{
 background:rgba(255,255,255,.14);backdrop-filter:blur(12px);
 border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;
 animation:slidein .35s cubic-bezier(.2,.9,.3,1.3);border:1px solid rgba(255,255,255,.08);
}
.notif-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:linear-gradient(135deg,#4a7dff,#2a4acc)}
.notif-icon.samsung{background:linear-gradient(135deg,#1f5eff,#0d47d6)}
.notif-icon.apple{background:linear-gradient(135deg,#e0e0e0,#888);color:#000}
.notif-icon.google{background:linear-gradient(135deg,#34a853,#1a7330)}
.notif-icon.xiaomi{background:linear-gradient(135deg,#ff6900,#d94a00)}
.notif-body{flex:1;min-width:0}
.notif-title{font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif-sub{font-size:8px;color:rgba(255,255,255,.6);margin-top:1px}
.notif-time{font-size:7px;color:rgba(255,255,255,.4);align-self:flex-start;flex-shrink:0}
@keyframes slidein{from{opacity:0;transform:translateY(-16px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
.phone-empty{color:rgba(255,255,255,.3);font-size:10px;text-align:center;padding:20px;font-style:italic}
.notif-count{position:absolute;top:24px;right:16px;background:#ff3b30;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;display:none;z-index:5}
.notif-count.on{display:block}
.phone-home-bar{height:4px;width:100px;background:rgba(255,255,255,.4);border-radius:2px;margin:6px auto 8px}

/* OLED color picker */
#oled-color-bar{padding:6px 10px;border-top:1px solid var(--ln);background:#0a0d18;display:flex;gap:5px;align-items:center;font-size:11px;color:#9fb0d8}
#oled-color-bar select{font-size:11px;padding:3px 6px}

/* phone toggle button */
.toggle-btn{font-size:10px;padding:3px 8px;border-radius:5px}

@media (max-width:800px){
 #layout{flex-direction:column}
 #right{width:auto;height:280px;border-left:0;border-top:1px solid var(--ln);flex-direction:row}
 #phone-wrap{flex-direction:row;padding:6px;overflow-x:auto}
 .phone{width:180px;height:280px;border-radius:24px;padding:6px}
 .phone::before{width:50px;height:14px;top:6px}
 .phone-screen{border-radius:20px}
 .notif-icon{width:22px;height:22px;font-size:12px;border-radius:6px}
 .notif-title{font-size:8px}
 .notif-sub{font-size:6px}
 .phone-status{height:18px;font-size:7px;padding:0 10px}
 .phone-home-bar{width:60px;margin:3px auto 4px}
}

<div id="top">
 <button id="run">▶ Старт</button>
 <button id="stop">■ Стоп</button>
 <select id="ex"></select>
 <button id="rst" title="Очистити схему">🧹</button>
 <button class="toggle-btn" id="phone-toggle" title="Показати/сховати телефон">📱 Phone</button>
 <button class="toggle-btn" id="spectrum-toggle" title="nRF24 Spectrum">📡 2.4GHz</button>
 <div id="st">Готово. Додай деталі, з'єднай піни.</div>
</div>

<div id="layout">
 <div id="left">
  <div id="main">
   <div class="pane on" id="p0"><svg id="svg" preserveAspectRatio="none"></svg></div>
   <div class="pane" id="p1"><textarea id="code" spellcheck="false" autocapitalize="off"></textarea></div>
   <div class="pane" id="p2"><div id="ser"></div></div>
   <div class="pane" id="p3"><canvas id="spectrum" style="width:100%;height:100%;display:block;background:#05080f"></canvas></div>
  </div>
  <div id="pal"></div>
  <div id="tabs">
   <button class="on">🔌 Схема</button>
   <button>📝 Код</button>
   <button>📟 Serial</button>
   <button>📡 2.4GHz</button>
  </div>
 </div>
 <div id="right">
  <div id="right-hdr">
   <span>📱 Virtual Phone</span>
   <button class="toggle-btn" onclick="clearNotifs()" style="font-size:9px;padding:2px 6px">🗑 Clear</button>
  </div>
  <div id="phone-wrap">
   <div class="phone">
    <div class="phone-screen">
     <div class="phone-status">
      <span class="phone-time" id="phone-time">12:34</span>
      <span class="phone-icons">📶 🔋</span>
     </div>
     <div class="notif-count" id="notif-count">0</div>
     <div class="notif-area" id="notif-area">
      <div class="phone-empty" id="phone-empty">Notifications will appear here...</div>
     </div>
     <div class="phone-home-bar"></div>
    </div>
   </div>
  </div>
  <div id="oled-color-bar">
   <span>🎨 OLED:</span>
   <select id="oled-color-sel" onchange="setOledColor(this.value)">
    <option value="blue">Синій (синій/жовтий)</option>
    <option value="yellow">Жовтий (жовтий/чорний)</option>
    <option value="green">Зелений</option>
    <option value="red">Червоний</option>
    <option value="cyan">Cyan</option>
    <option value="white">Білий</option>
    <option value="orange">Оранжевий</option>
   </select>
  </div>
 </div>
</div>

<script>
/* ============= UI setup ============= */
const $=id=>document.getElementById(id);
const def={oledColor:'blue'};
try{const s=localStorage.getItem('sim_ui');if(s)Object.assign(def,JSON.parse(s))}catch(e){}
$('oled-color-sel').value=def.oledColor;

/* ============= Board defs ============= */
const mkPins=(R,L)=>{const p={};R.forEach((n,i)=>p[n]=[150,18+i*13]);L.forEach((n,i)=>p[n]=[0,18+i*13]);return p};
const DEF={
 uno:{n:'Arduino Uno',w:150,h:205,mcu:1,v:5,pins:mkPins(['5V','GND','D13','D12','D11','D10','D9','D8','D7','D6','D5','D4','D3','D2'],['A0','A1','A2','A3','A4','A5','3V3','VIN'])},
 esp:{n:'ESP32',w:150,h:205,mcu:1,v:3.3,pins:mkPins(['3V3','GND','G2','G4','G5','G12','G13','G14','G15','G16','G17','G18','G19','G21'],['G22','G23','G25','G26','G27','G32','G33','G34','G35','G36'])},
 noname:{n:'No-Name ESP32',w:150,h:205,mcu:1,v:3.3,pins:mkPins(['3V3','GND','G2','G4','G5','G12','G13','G14','G15','G16','G17','G18','G19','G21'],['G22','G23','G25','G26','G27','G32','G33','G34','G35','G36'])},
 nano:{n:'Arduino Nano',w:70,h:180,mcu:1,v:5,pins:(()=>{const p={};['D13','D12','D11','D10','D9','D8','D7','D6','D5','D4','D3','D2','GND'].forEach((n,i)=>p[n]=[0,16+i*12]);['A0','A1','A2','A3','A4','A5','5V','3V3','VIN'].forEach((n,i)=>p[n]=[70,16+i*12]);return p})()},
 cyd:{n:'CYD ESP32-2432S028R',w:300,h:190,mcu:1,v:3.3,pins:{GND:[300,14],VIN:[300,32],G35:[300,50],G22:[300,68],G21:[300,86],G27:[300,104],'3V3':[300,122]}},
 nrf:{n:'nRF24L01',w:74,h:44,pins:(()=>{const p={};['VCC','GND','CE','CSN','SCK','MOSI','MISO','IRQ'].forEach((n,i)=>p[n]=[5+i*9,44]);return p})()},
 dht:{n:'DHT22',w:34,h:46,pins:{VCC:[6,46],DATA:[17,46],GND:[28,46]}},
 oled:{n:'OLED SSD1306',w:96,h:66,pins:{GND:[12,66],VCC:[36,66],SCL:[60,66],SDA:[84,66]}},
 lcd:{n:'LCD1602 I2C',w:130,h:60,pins:{GND:[12,60],VCC:[44,60],SDA:[76,60],SCL:[108,60]}},
 neo:{n:'NeoPixel 8',w:100,h:22,pins:{VCC:[10,22],DIN:[50,22],GND:[90,22]}},
 led:{n:'LED',w:26,h:44,pins:{A:[5,44],K:[21,44]}},
 rgb:{n:'RGB LED',w:30,h:50,pins:{R:[4,50],K:[11,50],G:[19,50],B:[26,50]}},
 res:{n:'Резистор',w:54,h:14,pins:{1:[0,7],2:[54,7]}},
 btn:{n:'Кнопка',w:34,h:34,pins:{1:[0,17],2:[34,17]}},
 pot:{n:'Потенціометр',w:44,h:44,pins:{1:[6,44],S:[22,44],2:[38,44]}},
 buz:{n:'Зумер',w:34,h:34,pins:{'+':[8,34],'-':[26,34]}},
 srv:{n:'Серво',w:70,h:40,pins:{V:[0,8],G:[0,20],S:[0,32]}},
 ir:{n:'IR Receiver',w:40,h:40,pins:{VCC:[6,40],GND:[14,40],OUT:[26,40]}}
};
const LC=[['#ff3b3b','Червоний',1.9],['#3bff6b','Зелений',2.1],['#4da3ff','Синій',3],['#ffd83b','Жовтий',2.1],['#ffffff','Білий',3]];
const WC=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f43','#00d2d3'];

/* ============= State ============= */
let parts=[],wires=[],nid=1,sel=null,wireStart=null,drag=null,dirty=1;
let VB={x:-10,y:0,w:360,h:600};
let PS={},SA={},ton=null,NV=[],NET=null,sbuf='',sdirty=0;
const run={on:false,gen:0};
const byId=i=>parts.find(c=>c.id==i);
const svg=$('svg');

/* ============= Phone notifications ============= */
let notifCount=0;
const NOTIF_MAX=30;
const NOTIF_TEMPLATES={
 apple:{icon:'🎧',cls:'apple',title:'AirPods Pro',sub:'Підключити натисніть'},
 appleMax:{icon:'🎧',cls:'apple',title:'AirPods Max',sub:'Підключити натисніть'},
 appleTV:{icon:'📺',cls:'apple',title:'Apple TV Setup',sub:'Продовжити налаштування'},
 samsungBuds:{icon:'🎧',cls:'samsung',title:'Galaxy Buds2',sub:'Торкніться щоб підключити'},
 samsungWatch:{icon:'⌚',cls:'samsung',title:'Galaxy Watch5',sub:'Новий годинник поруч'},
 google:{icon:'🎧',cls:'google',title:'Pixel Buds Pro',sub:'Знайдено новий пристрій'},
 xiaomi:{icon:'⌚',cls:'xiaomi',title:'Mi Band 7',sub:'Підключити?'},
 beacon:{icon:'📶',cls:'',title:'Free WiFi',sub:'Нова мережа поруч'},
 default:{icon:'📱',cls:'',title:'Новий пристрій',sub:'Виявлено поруч'}
};
function pushNotif(type){
 const t=NOTIF_TEMPLATES[type]||NOTIF_TEMPLATES.default;
 const area=$('notif-area');
 if(notifCount>=NOTIF_MAX){area.removeChild(area.firstChild)}
 const empty=$('phone-empty');if(empty)empty.remove();
 const el=document.createElement('div');
 el.className='notif';
 const time=new Date();
 el.innerHTML=`
  <div class="notif-icon ${t.cls}">${t.icon}</div>
  <div class="notif-body">
   <div class="notif-title">${t.title}</div>
   <div class="notif-sub">${t.sub}</div>
  </div>
  <div class="notif-time">${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}</div>`;
 area.appendChild(el);
 area.scrollTop=area.scrollHeight;
 notifCount++;
 const c=$('notif-count');c.textContent=notifCount;c.classList.add('on');
}
function clearNotifs(){
 const a=$('notif-area');a.innerHTML='<div class="phone-empty" id="phone-empty">Notifications will appear here...</div>';
 notifCount=0;$('notif-count').classList.remove('on');
}
// clock
setInterval(()=>{const d=new Date();$('phone-time').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');},5000);

/* ============= OLED color ============= */
function setOledColor(c){
 def.oledColor=c;localStorage.setItem('sim_ui',JSON.stringify(def));
 // update all existing oled displays
 for(const k in GFX){const g=GFX[k];if(g&&g.mono)g.color=OLED_COLORS[c]||'#8fe3ff';g.d=1}
 dirty=1;
}
const OLED_COLORS={
 blue:['#000','#8fe3ff'],
 yellow:['#000','#ffd83b'],
 green:['#000','#5fff8f'],
 red:['#000','#ff5f5f'],
 cyan:['#000','#5fffff'],
 white:['#000','#ffffff'],
 orange:['#000','#ff9f43']
};

/* ============= Resize ============= */
function fit(){const r=svg.getBoundingClientRect();if(r.width)VB.h=VB.w*r.height/r.width;svg.setAttribute('viewBox',`${VB.x} ${VB.y} ${VB.w} ${VB.h}`);dirty=1}
addEventListener('resize',fit);

/* ============= Add part ============= */
const INIT={pir:{latch:true},sw:{latch:true}};
function add(t,x,y,o){const c=Object.assign({id:nid++,t,x,y,c:0,val:220,v:.5,h:.5,m:0,on:false,latch:false},INIT[t]||{},o||{});parts.push(c);return c}

/* ============= Net solver ============= */
function netsOf(){const par={};const pins=[];
 parts.forEach(c=>Object.keys(DEF[c.t].pins).forEach(n=>{const id=c.id+':'+n;par[id]=id;pins.push(id)}));
 const f=a=>{while(par[a]!==a)a=par[a];return a};
 wires.forEach(([a,b])=>{if(par[a]!==undefined&&par[b]!==undefined)par[f(a)]=f(b)});
 const g=parts.filter(c=>DEF[c.t].mcu).map(c=>c.id+':GND');for(let i=1;i<g.length;i++)par[f(g[i])]=f(g[0]);
 const idx={},net={};let n=0;pins.forEach(p=>{const r=f(p);if(idx[r]===undefined)idx[r]=n++;net[p]=idx[r]});
 return{net,n,gnd:g.length?net[g[0]]:-1}}
function gauss(A,n){for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];const d=A[i][i]||1e-12;
  for(let r=i+1;r<n;r++){const k=A[r][i]/d;if(k)for(let c=i;c<=n;c++)A[r][c]-=k*A[i][c]}}
 const x=new Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=A[i][n];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/(A[i][i]||1e-12)}return x}
function solve(){NET=netsOf();const{net,n,gnd}=NET;NV=new Array(n).fill(0);if(gnd<0||!n)return;
 const G=Array.from({length:n},()=>new Float64Array(n+1));
 const th=(a,g,v)=>{G[a][a]+=g;G[a][n]+=g*v};
 const st=(a,b,g)=>{if(a===b)return;G[a][a]+=g;G[b][b]+=g;G[a][b]-=g;G[b][a]-=g};
 const N=(c,k)=>net[c.id+':'+k],leds=[];
 for(let i=0;i<n;i++)G[i][i]+=1e-9;
 for(const c of parts){const d=DEF[c.t];
  if(d.mcu){th(N(c,'GND'),1e3,0);const p5=N(c,'5V'),p3=N(c,'3V3');if(p5!==undefined)th(p5,1e3,5);if(p3!==undefined)th(p3,1e3,3.3);if(c.t=='cyd')th(N(c,'VIN'),1e3,5);
   for(const k in d.pins){const s=PS[c.id+':'+k];if(!s)continue;if(s.m=='out')th(N(c,k),1/40,s.v*d.v);else if(s.m=='pu')th(N(c,k),1/20000,d.v)}}
  else if(c.t=='led')leds.push({c,key:'cur',a:N(c,'A'),k:N(c,'K'),vf:LC[c.c][2]});
  else if(c.t=='rgb'){[['R','cr',2],['G','cg',3],['B','cb',3]].forEach(([p,key,vf])=>leds.push({c,key,a:N(c,p),k:N(c,'K'),vf}))}
  else if(c.t=='sw')st(N(c,1),N(c,2),c.on?1e3:1e-9);
  else if(c.t=='res')st(N(c,1),N(c,2),1/Math.max(c.val,.01));
  else if(c.t=='btn')st(N(c,1),N(c,2),c.on?1e3:1e-9);
  else if(c.t=='pot'){st(N(c,1),N(c,'S'),1/(1+1e4*c.v));st(N(c,'S'),N(c,2),1/(1+1e4*(1-c.v)))}
  else if(c.t=='buz')st(N(c,'+'),N(c,'-'),1/2000);
  else if(c.t=='srv')st(N(c,'V'),N(c,'G'),1/400)}
 G[gnd][gnd]+=1e6;
 let on=leds.map(()=>false),x;
 for(let it=0;it<10;it++){const A=G.map(r=>Float64Array.from(r));
  leds.forEach((d,i)=>{if(on[i]){const{a,k,vf}=d,g=1/8;A[a][a]+=g;A[k][k]+=g;A[a][k]-=g;A[k][a]-=g;A[a][n]+=g*vf;A[k][n]-=g*vf}});
  x=gauss(A,n);const nn=leds.map(d=>x[d.a]-x[d.k]>d.vf);if(nn.every((v,i)=>v==on[i]))break;on=nn}
 NV=x;leds.forEach((d,i)=>{const I=on[i]?Math.max(0,(x[d.a]-x[d.k]-d.vf)/8):0;d.c[d.key]=I;if(d.key=='cur')d.c.burn=I>.04});
 for(const c of parts){const g=net[c.id+':GND'],v=net[c.id+':VCC'];c.pw=v!==undefined&&g!==undefined&&x[v]-x[g]>2.8;
  if(c.t=='nrf'){c.vcc=v!==undefined&&g!==undefined?x[v]-x[g]:0;c.burn=c.vcc>3.6}}}
const volt=id=>NET&&NET.net[id]!==undefined?NV[NET.net[id]]||0:0;

/* ============= Transpile ============= */
function transpile(src){
 src=src.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');
 src=src.replace(/^\s*#include.*$/gm,'');

function scanSpectrum(){
 const nrf=parts.find(c=>c.t=='nrf');if(!nrf||!nrf.pw)return;
 const now=performance.now();
 for(const r of RADIOS){
  if(!r.ok)continue;
  // add peaks near common WiFi channels (2.4GHz: WiFi ch1=2402, ch6=2437, ch13=2472, BLE adv=37/38/39)
  // nRF ch = (freq - 2400) MHz  → ch 2=ch1 WiFi? Let's just simulate
  const peaks=[
   {ch:2+Math.floor(Math.random()*4),w:3},{ch:26+Math.floor(Math.random()*4),w:4},
   {ch:61+Math.floor(Math.random()*4),w:4},{ch:0,w:2},{ch:12,w:2},{ch:39,w:2}
  ];
  for(let i=0;i<r.spectrum.length;i++)r.spectrum[i]*=0.88;
  for(const p of peaks){
   const c=Math.floor(p.ch+Math.random()*p.w);
   if(c>=0&&c<r.spectrum.length)r.spectrum[c]=Math.min(255,r.spectrum[c]+(60+Math.random()*120));
  }
 }
}

 spctx.fillText('ch'+curCh,xc,padT+10);
}

#include <RF24.h>

RF24 radio(CE_PIN, CSN_PIN);

void setup() {
  Serial.begin(115200);

    Serial.println("nRF24 не відповідає!");
    while (1) delay(1000);
  }
  radio.setPALevel(RF24_PA_MAX);
  radio.setAutoAck(false);
  radio.startListening();
}

void loop() {
  // скануємо всі канали 0-125

    radio.startConstCarrier(RF24_PA_MAX, ch);  // sim hack

    delay(2);
  }
  Serial.println();
